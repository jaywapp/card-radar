name: Release Android APK

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: card-radar-production
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          cache: true

      - name: Create github_config.dart from secrets
        run: |
          cat > lib/core/github_config.dart << 'EOF'
          const String githubIssueToken = '${{ secrets.GH_ISSUE_TOKEN }}';
          EOF

      - name: Create kftc_config.dart from secrets
        run: |
          cat > lib/core/kftc_config.dart << 'EOF'
          const String kftcClientId = '${{ secrets.KFTC_CLIENT_ID }}';
          const String kftcClientSecret = '${{ secrets.KFTC_CLIENT_SECRET }}';
          const String kftcRedirectUri = 'https://kmgoanbulmxmeuzmxmnv.supabase.co/functions/v1/kftc-callback';
          const String kftcBaseUrl = 'https://testapi.openbanking.or.kr';
          EOF

      - name: Get dependencies
        run: flutter pub get --enforce-lockfile

      - name: Read application version
        id: version
        shell: bash
        run: |
          version="$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/p' pubspec.yaml)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Reject an existing release version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "::error::Release tag ${RELEASE_TAG} already exists. Update pubspec.yaml version."
            exit 1
          fi

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Verify and normalize APK
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          source_apk="build/app/outputs/flutter-apk/app-release.apk"
          target_apk="build/app/outputs/flutter-apk/card-radar-${APP_VERSION}-release.apk"
          test -s "$source_apk"
          build_tools="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$ANDROID_HOME/build-tools/$build_tools/apksigner" verify --verbose --print-certs "$source_apk"
          mv "$source_apk" "$target_apk"
          echo "APK_PATH=$target_apk" >> "$GITHUB_ENV"

      - name: Upload APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: ${{ env.APK_PATH }}
          name: "카드레이더 ${{ steps.version.outputs.version }}"
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
