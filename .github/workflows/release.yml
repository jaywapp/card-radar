name: Release Android APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Prepare release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks

      - name: Build APK (release)
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/android/app/release-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KFTC_CLIENT_ID: ${{ secrets.KFTC_CLIENT_ID }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: flutter build apk --release --dart-define=KFTC_CLIENT_ID="$KFTC_CLIENT_ID" --dart-define=SENTRY_DSN="$SENTRY_DSN"

      - name: Upload APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          name: "카드레이더 ${{ github.ref_name }}"
          body: |
            ## 카드레이더 ${{ github.ref_name }}

            ### 변경 사항
            - 지도에서 가게 탭 시 해당 가게에 혜택 있는 카드만 추천
            - 가맹점별 혜택 필터링 (CU → CU 혜택 카드, SK주유소 → SK 혜택 카드 등)
            - 지도 심볼 탭 → 카드 추천 직접 연결 (기존 카테고리 선택 단계 제거)

            ### 설치 방법
            1. `app-release.apk` 다운로드
            2. Android 기기에서 알 수 없는 출처 허용
            3. APK 설치
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
