name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: card-radar-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          cache: true

      - name: Create github_config.dart
        run: |
          cat > lib/core/github_config.dart << 'EOF'
          const String githubIssueToken = '${{ secrets.GH_ISSUE_TOKEN }}';
          EOF

      - name: Create kftc_config.dart
        run: |
          cat > lib/core/kftc_config.dart << 'EOF'
          const String kftcClientId = '${{ secrets.KFTC_CLIENT_ID }}';
          const String kftcClientSecret = '${{ secrets.KFTC_CLIENT_SECRET }}';
          const String kftcRedirectUri = 'https://kmgoanbulmxmeuzmxmnv.supabase.co/functions/v1/kftc-callback';
          const String kftcBaseUrl = 'https://testapi.openbanking.or.kr';
          EOF

      - name: Get dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build APK (debug)
        run: flutter build apk --debug
